[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetes-ml"
version = "0.1.0"
description = "Imbalance-aware three-class diabetes status classification from BRFSS health indicators"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "torch", "catboost", "matplotlib", "seaborn", "joblib"]

[project.optional-dependencies]
dev = ["pytest", "nbformat", "nbclient", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
